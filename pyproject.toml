[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-auto-fetcher"
version = "0.1.0"
description = "Personal YouTube discovery, scoring, download and serving pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real sentence-transformer embeddings. Heavy; not needed for the test suite,
# which uses the deterministic HashingEmbedder.
embed = [
    "sentence-transformers>=2.2",
]
# Classifier training (Phase 7). Runs on natgentoo, not the Pi.
train = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ytaf = "ytaf.cli:main"
yt-discover = "ytaf.cli:main_discover"
yt-score = "ytaf.cli:main_score"
yt-download = "ytaf.cli:main_download"
yt-feedback = "ytaf.cli:main_feedback"
yt-retrain = "ytaf.cli:main_retrain"
yt-retain = "ytaf.cli:main_retain"
yt-monitor = "ytaf.cli:main_monitor"

[tool.hatch.build.targets.wheel]
packages = ["src/ytaf"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
markers = [
    "slow: downloads or loads a real ML model; deselect with -m 'not slow'",
    "network: touches the real network (YouTube, Jellyfin); deselect with -m 'not network'",
    "systemd: requires systemd-analyze on PATH",
]
